name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: stashi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - run: npm test
      - name: Validate migrations on disposable Postgres
        env:
          CONTROL_PLANE_DATABASE_URL: postgresql://test_user:test_password@localhost:5432/stashi_test?sslmode=disable
        run: node scripts/apply-auth-migration.mjs
      - run: npm run build
        env:
          CONTROL_PLANE_DATABASE_URL: postgresql://test_user:test_password@localhost:5432/stashi_test?sslmode=disable
          BETTER_AUTH_SECRET: ci-secret-placeholder-minimum-32-chars-long
          BETTER_AUTH_URL: http://localhost:3000
