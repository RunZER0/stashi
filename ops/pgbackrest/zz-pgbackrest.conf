# Deployed to /etc/postgresql/17/main/conf.d/zz-pgbackrest.conf on the
# production node, owned by postgres:postgres. Kept in its own conf.d file
# (rather than editing postgresql.conf directly) so it can be added or
# removed cleanly.
#
# archive_mode is PGC_POSTMASTER - changing it requires a full PostgreSQL
# restart, not just a reload. archive_command is PGC_SIGHUP and can be
# changed with pg_reload_conf() alone. Validate with pg_reload_conf() +
# a check on pg_settings.pending_restart before scheduling the restart.

archive_mode = on
archive_command = 'pgbackrest --stanza=main archive-push %p'
